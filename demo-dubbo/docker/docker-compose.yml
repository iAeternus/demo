version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.9
    container_name: dubbo-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - zookeeper-data:/data
      - zookeeper-logs:/datalog
    healthcheck:
      test: [ "CMD", "zkServer.sh", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dubbo-net

  provider:
    build:
      context: ../..
      dockerfile: demo-dubbo/docker/Dockerfile
      target: provider
    image: demo-dubbo/provider:latest
    container_name: dubbo-provider
    restart: always
    ports:
      - "8081:8081"
      - "20880:20880"
    environment:
      - TZ=Asia/Shanghai
      - JVM_OPTS=-Xms256m -Xmx512m
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dubbo-net

  consumer:
    build:
      context: ../..
      dockerfile: demo-dubbo/docker/Dockerfile
      target: consumer
    image: demo-dubbo/consumer:latest
    container_name: dubbo-consumer
    restart: always
    ports:
      - "8082:8082"
    environment:
      - TZ=Asia/Shanghai
      - JVM_OPTS=-Xms256m -Xmx512m
    depends_on:
      zookeeper:
        condition: service_healthy
      provider:
        condition: service_healthy
    networks:
      - dubbo-net

networks:
  dubbo-net:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-logs:
